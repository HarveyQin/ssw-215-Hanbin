<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanbin Qin</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav" aria-label="Main navigation">
        <a class="nav-link" href="#projects">Projects</a>
        <a class="nav-link" href="https://github.com/HarveyQin" target="_blank" rel="noopener">GitHub</a>
      </nav>

      <div class="container hero">
        <section class="hero-copy" aria-labelledby="welcome-heading">
          <h2 id="welcome-heading" class="section-heading">Welcome</h2>
          <h1>Hanbin Qin</h1>
          <p class="subtitle">TA for SSW-215</p>
          <p class="bio">LLM in Software Engineering</p>
          <a class="button-link" href="#projects">See my projects</a>
        </section>

        <div class="hero-media" aria-label="Hanbin Qin portrait">
          <img src="assets/avatar.png" alt="Hanbin Qin avatar" width="220" height="220" />
        </div>
      </div>
    </header>

    <main>
      <section class="projects-section" id="projects" aria-labelledby="projects-heading">
        <div class="container">
          <h2 id="projects-heading">Projects</h2>
          <div class="projects-grid">
            <article class="card">
              <h3>LLM in software testing</h3>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a href="https://github.com/HarveyQin" target="_blank" rel="noopener">GitHub</a>
      </div>
    </footer>
  </body>
</html>
