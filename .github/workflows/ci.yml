name: SSW 215 CI Pipeline
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Labs/Lab11
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - name: Install dependencies
              run: pip install -r requirements.txt pytest
            
            - name: Run unit tests
              run: pytest -v